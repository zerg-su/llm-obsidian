schema_version = 1

# The only hand-edited concrete runtime and role defaults. Native host configs are
# synchronized from this file by scripts/model_routing.py sync-native.
[runtimes.codex]
model = "gpt-5.6-sol"
effort = "high"

[runtimes.claude]
model = "claude-opus-5"
effort = "high"

[roles.daily]
effort = "medium"

[roles.deep]
effort = "xhigh"

[roles.review.codex]
model = "gpt-5.6-sol"
effort = "high"

[roles.review.claude]
model = "opus"
effort = "high"

[model_aliases.sol]
runtime = "codex"
target = "gpt-5.6-sol"

[model_aliases.terra]
runtime = "codex"
target = "gpt-5.6-terra"

[model_aliases.opus]
runtime = "claude"
target = "claude-opus-5"
expected_generation = 5

[model_aliases.fable]
runtime = "claude"
target = "fable"
expected_generation = 5

[review_profiles.simple.codex]
model = "sol"
effort = "high"

[review_profiles.simple.claude]
model = "opus"
effort = "high"

[review_profiles.deep.codex]
model = "sol"
effort = "xhigh"

[review_profiles.deep.claude]
model = "fable"
effort = "xhigh"

# Historical stock values accepted by the clean-cut upgrade gate without
# creating a local override.
[legacy_review_defaults.codex]
model = "gpt-5.6-sol"
effort = "high"

[legacy_review_defaults.claude]
model = "fable"
effort = "high"

[model_registry]
"gpt-5.6-sol" = "codex"
"gpt-5.6-terra" = "codex"
fable = "claude"
opus = "claude"
"claude-opus-5" = "claude"
sonnet = "claude"
